name: release

# 一键构建全平台安装包：推送 v* 标签或手动触发
# 产物：Android APK / Windows EXE / macOS ZIP，并自动创建 GitHub Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # 正式签名 keystore 通过 Secrets(ANDROID_KEYSTORE_BASE64 等) 注入；
      # 未配置时自动生成演示 keystore，保证产物可直接安装
      - name: Prepare keystore
        working-directory: shell/android/app
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          else
            keytool -genkeypair -v -keystore release.keystore -alias crossbuy \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass crossbuy2026 -keypass crossbuy2026 \
              -dname "CN=CrossBuy, OU=CrossBuy, O=CrossBuy, L=HK, C=HK"
          fi

      - name: Build APK
        working-directory: shell/android
        run: gradle assembleRelease --no-daemon

      - name: Rename artifact
        run: |
          mkdir -p out
          cp shell/android/app/build/outputs/apk/release/app-release.apk out/crossbuy-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: crossbuy-android
          path: out/crossbuy-android.apk

  desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: macos-latest
            args: --mac --universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build desktop app
        working-directory: shell/electron
        run: |
          npm install
          npx electron-builder ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            shell/electron/dist/crossbuy-win.*
            shell/electron/dist/crossbuy-mac.*

  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
