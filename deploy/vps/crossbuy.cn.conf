server {
    listen 80;
    listen 443 ssl;
    http2 on;
    ssl_certificate    /www/server/panel/vhost/cert/xluxury.site/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/xluxury.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    server_name crossbuy.cn www.crossbuy.cn;
    access_log /www/wwwlogs/crossbuy.cn.log;
    error_log /www/wwwlogs/crossbuy.cn.error.log;

    client_max_body_size 20m;
    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # CrossBuy 主域：全站反代（80/443 同时服务，兼容 Cloudflare Flexible/Full 两种回源模式）
    # 源站证书复用现有文件（Cloudflare Full 模式不校验源站证书名），访客侧由 CF 边缘证书加密
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
