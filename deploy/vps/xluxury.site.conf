# 旧主域整站 301 到品牌主域 crossbuy.cn（SEO 权重传递；客户端 v1.1.x 内嵌旧地址也自动跟随）
# vps.xluxury.site 为运维子域，继续反代应用不跳转
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    ssl_certificate    /www/server/panel/vhost/cert/xluxury.site/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/xluxury.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name xluxury.site www.xluxury.site;
    access_log /www/wwwlogs/xluxury.site.log;
    error_log /www/wwwlogs/xluxury.site.error.log;

    return 301 https://crossbuy.cn$request_uri;
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    ssl_certificate    /www/server/panel/vhost/cert/xluxury.site/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/xluxury.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name vps.xluxury.site;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
