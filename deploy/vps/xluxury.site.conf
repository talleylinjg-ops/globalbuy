server {
    listen 80;
    listen 443 ssl;
    http2 on;
    ssl_certificate    /www/server/panel/vhost/cert/xluxury.site/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/xluxury.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    server_name xluxury.site www.xluxury.site vps.xluxury.site;
    access_log /www/wwwlogs/xluxury.site.log;
    error_log /www/wwwlogs/xluxury.site.error.log;

    client_max_body_size 20m;
    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # CrossBuy 全站反代（80/443 同时服务，兼容 Cloudflare Flexible/Full 两种回源模式）
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
